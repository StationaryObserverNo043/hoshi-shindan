<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪐SNS星タイプ診断｜地球侵略阻止ミッション</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --bg: #02060f;
  --panel: #080f1e;
  --border: #0f2040;
  --accent: #00c8ff;
  --accent2: #ff6b35;
  --accent3: #7fff6b;
  --gold: #ffd700;
  --text: #b8ccd8;
  --dim: #3a5060;
  --white: #e8f4f8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* 星フィールド */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle var(--dur) ease-in-out infinite;
  opacity: var(--op);
}
@keyframes twinkle {
  0%,100% { opacity: var(--op); transform: scale(1); }
  50% { opacity: calc(var(--op) * 0.3); transform: scale(0.7); }
}

/* スキャンライン */
body::after {
  content: '';
  position: fixed;
  left: 0; right: 0; height: 2px;
  background: linear-gradient(to right, transparent, rgba(0,200,255,0.12), transparent);
  animation: scan 8s linear infinite;
  pointer-events: none;
  z-index: 1;
}
@keyframes scan { 0%{top:-5%} 100%{top:105%} }

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  position: relative;
  z-index: 2;
}

/* ヘッダー */
.header {
  text-align: center;
  margin-bottom: 40px;
  animation: fadeDown 0.8s ease both;
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
.header .jaco-label {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 16px;
  animation: pulse 3s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:0.7} 50%{opacity:1} }
.header h1 {
  font-family: 'Orbitron', monospace;
  font-size: clamp(20px, 5vw, 32px);
  font-weight: 900;
  color: var(--white);
  line-height: 1.3;
  text-shadow: 0 0 40px rgba(0,200,255,0.4);
  margin-bottom: 8px;
}
.header h1 span { color: var(--gold); }
.header .sub {
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 1px;
}
.loading-bar {
  width: 200px;
  height: 2px;
  background: var(--border);
  margin: 20px auto 0;
  border-radius: 1px;
  overflow: hidden;
}
.loading-bar::after {
  content: '';
  display: block;
  height: 100%;
  background: var(--accent);
  animation: load 2s ease-in-out infinite;
}
@keyframes load { 0%{width:0;margin-left:0} 50%{width:100%;margin-left:0} 100%{width:0;margin-left:100%} }

/* イントロ */
.intro {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 32px;
  font-size: 13px;
  line-height: 2;
  color: var(--text);
  animation: fadeUp 0.8s 0.2s ease both;
  position: relative;
  overflow: hidden;
}
.intro::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right, var(--accent), transparent);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.intro .jaco {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.intro .jaco::before { content: '🤖'; }

/* 進捗 */
.progress-wrap {
  margin-bottom: 28px;
  animation: fadeUp 0.8s 0.3s ease both;
}
.progress-label {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--dim);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}
.progress-track {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(to right, var(--accent), var(--accent3));
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}

/* 質問カード */
.question-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  margin-bottom: 24px;
  animation: fadeUp 0.5s ease both;
  transition: border-color 0.3s;
}
.question-card:hover { border-color: rgba(0,200,255,0.3); }
.q-number {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 12px;
}
.q-text {
  font-size: 15px;
  font-weight: 700;
  color: var(--white);
  line-height: 1.7;
  margin-bottom: 20px;
}
.q-sub {
  font-size: 11px;
  color: var(--dim);
  margin-top: -12px;
  margin-bottom: 20px;
  line-height: 1.6;
}

/* 選択肢 */
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.option-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  line-height: 1.6;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.option-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.25s;
}
.option-btn:hover {
  border-color: var(--accent);
  color: var(--white);
  transform: translateX(4px);
}
.option-btn:hover::before { opacity: 0.06; }
.option-btn.selected {
  border-color: var(--accent);
  color: var(--white);
  background: rgba(0,200,255,0.08);
}
.option-btn .opt-label {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  color: var(--accent);
  margin-right: 8px;
  opacity: 0.8;
}

/* ナビボタン */
.nav-row {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 8px;
}
.btn {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 12px 24px;
  border-radius: 8px;
  cursor: pointer;
  border: none;
  transition: all 0.25s;
}
.btn-primary {
  background: var(--accent);
  color: var(--bg);
  font-weight: 700;
}
.btn-primary:hover {
  background: #fff;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,200,255,0.3);
}
.btn-primary:disabled {
  background: var(--dim);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-secondary {
  background: transparent;
  color: var(--dim);
  border: 1px solid var(--border);
}
.btn-secondary:hover { color: var(--text); border-color: var(--dim); }

/* 結果画面 */
#result-screen {
  display: none;
  animation: fadeUp 0.8s ease both;
}

.result-header {
  text-align: center;
  margin-bottom: 32px;
}
.result-label {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 12px;
}
.result-jaco {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  font-size: 12px;
  line-height: 1.8;
  margin-bottom: 28px;
  color: var(--text);
}
.result-jaco strong { color: var(--accent); }

.result-card {
  background: var(--panel);
  border-radius: 20px;
  padding: 32px 28px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  border: 1px solid transparent;
}
.result-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  padding: 1px;
  background: var(--grad);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
.result-icon {
  font-size: 48px;
  text-align: center;
  margin-bottom: 16px;
  display: block;
  filter: drop-shadow(0 0 20px currentColor);
}
.result-type-label {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 8px;
  opacity: 0.8;
}
.result-type-name {
  font-family: 'Orbitron', monospace;
  font-size: clamp(22px, 5vw, 32px);
  font-weight: 900;
  text-align: center;
  margin-bottom: 6px;
  text-shadow: 0 0 30px currentColor;
}
.result-type-sub {
  text-align: center;
  font-size: 13px;
  color: var(--dim);
  margin-bottom: 24px;
  font-style: italic;
}
.result-divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}
.result-desc {
  font-size: 14px;
  line-height: 2;
  color: var(--text);
  margin-bottom: 20px;
}
.result-advice {
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 16px 18px;
  font-size: 13px;
  line-height: 1.8;
  border-left: 3px solid;
}
.result-advice .adv-label {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 8px;
  opacity: 0.8;
}

/* CTA */
.cta-block {
  background: linear-gradient(135deg, rgba(0,200,255,0.06), rgba(255,215,0,0.06));
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 16px;
  padding: 28px 24px;
  text-align: center;
  margin-bottom: 24px;
}
.cta-jaco {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 12px;
  opacity: 0.8;
}
.cta-text {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text);
  margin-bottom: 20px;
}
.cta-btn {
  display: inline-block;
  background: linear-gradient(135deg, #ffd700, #ffb300);
  color: #000;
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 14px 28px;
  border-radius: 10px;
  text-decoration: none;
  transition: all 0.25s;
  box-shadow: 0 4px 20px rgba(255,215,0,0.2);
}
.cta-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(255,215,0,0.4);
}

.retry-btn {
  display: block;
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  color: var(--dim);
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.25s;
}
.retry-btn:hover { color: var(--text); border-color: var(--dim); }

.footer-note {
  text-align: center;
  font-size: 10px;
  color: var(--dim);
  margin-top: 32px;
  line-height: 1.8;
  font-family: 'Orbitron', monospace;
  letter-spacing: 1px;
}

/* Xシェアボタン */
.x-share-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  background: #000;
  color: #fff;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 14px 20px;
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.25s;
  margin-bottom: 12px;
  box-sizing: border-box;
}
.x-share-btn:hover {
  background: #1a1a1a;
  border-color: #555;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255,255,255,0.08);
}
.x-share-btn svg {
  flex-shrink: 0;
}

/* シェア画像ブロック */
.share-img-block {
  width: 100%;
  margin: 0 0 24px 0; /* 余白を調整 */
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  animation: fadeUp 0.8s 0.2s ease both; /* フワッと出るアニメーションを追加 */
}
.share-img {
  width: 100%;
  display: block;
}

/* hidden */
.hidden { display: none; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">

  <div class="header" id="main-header">
    <div class="jaco-label">《論理制御知性体J.A.C.O》診断システム起動中</div>
    <h1>🪐 <span>SNS星
