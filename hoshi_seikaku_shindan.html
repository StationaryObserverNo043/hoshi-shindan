<script>

      { text: "特に気にせず、自分の宇宙船のメンテナンスを黙々と続ける", val: "D" }
    ]
  },
  {
    text: "母艦の通信ログ（SNS）を見ていたら、おかしな暗号（トレンド）が流行っていマス。",
    opts: [
      { text: "暗号の発生源と、流行した数理的ロジックを突き止めたくなる", val: "A" },
      { text: "「これ面白い！」と、自分もすぐに真似して暗号で発信してみる", val: "B" },
      { text: "タイムラインが乱れるので、綺麗に整理整頓するか静観する", val: "C" },
      { text: "流行りには乗らず、自分が本当に書きたいログだけを淡々と残す", val: "D" }
    ]
  },
  {
    text: "宇宙嵐（トラブルや炎上）が接近中デス！コックピットでのアナタの行動は？",
    opts: [
      { text: "嵐のデータと進路を予測し、安全なシミュレーションを組み立てる", val: "A" },
      { text: "「みんな大丈夫！？」とクルーに声をかけ、励まして回る", val: "B" },
      { text: "管制塔として的確な指示を出し、全員の配置を統率する", val: "C" },
      { text: "ハッチを閉めてシェルターに篭り、嵐が過ぎ去るまで読書でもする", val: "D" }
    ]
  },
  {
    text: "地球のパパやママ（他のユーザー）から「育児ミッションが過酷デス…」とSOSを受信シマシタ。",
    opts: [
      { text: "効率的なタスク分散法や、便利な自動化ツールの情報をそっと送る", val: "A" },
      { text: "「本当にお疲れ様デス！夜食にヒップホップでも聴きまショウ！」と共感する", val: "B" },
      { text: "相談室（Forms）を開設し、構造的な解決へのロードマップを示す", val: "C" },
      { text: "言葉の代わりに、静かで温かいお茶（余白の時間）をそっと差し出す", val: "D" }
    ]
  },
  {
    text: "アナタにとって、この「地球侵略阻止ミッション（SNS）」の一番の目的は何デスか？",
    opts: [
      { text: "地球人の面白い生態データ（文脈）をたくさん収集すること", val: "A" },
      { text: "色んな星のクルーと繋がって、ゴキゲンな内輪ノリを楽しむこと", val: "B" },
      { text: "静かで noiseless な、誰の邪魔も入らない最強の秘密基地を作ること", val: "C" },
      { text: "自分という存在の座標を、宇宙の定点としてただ観測し続けること", val: "D" }
    ]
  }
];

// 結果データデス (惑星7種デス)
const planets = {
  "A": { icon: "🪐", tag: "Planet: Logasius", name: "ロガシウス星", sub: "【深淵の観測者】", grad: "linear-gradient(135deg, #2e1065 0%, #020617 100%)", color: "#a855f7", desc: "アナタの魂は、圧倒的な知性と分析力を持つ『ロガシウス星』に属していマス。タイムラインを冷徹にスキャンし、物事の本質やデータ、美しい文脈を見つけ出す天才デス。ノイズに惑わされず、あえて一歩引いた特等席から世界を観察する静かな引力を持っていマス。" },
  "B": { icon: "☀️", tag: "Planet: Zed", name: "ゼド星", sub: "【共鳴の恒星】", grad: "linear-gradient(135deg, #7c2d12 0%, #020617 100%)", color: "#f97316", desc: "アナタの魂は、周囲に強いエネルギーと光を与える『ゼド星』に属していマス。お祭りの中心にいたり、楽しい内輪ノリを自ら作り出すゴキゲンな太陽のような存在デス。アナタの発信は多くの地球人の心を弾ませ、孤独な夜の育児ミッションを優しく照らし出す力がありマス。" },
  "C": { icon: "🛡️", tag: "Planet: Quadun", name: "クワドゥン星", sub: "【秩序の母艦】", grad: "linear-gradient(135deg, #1e3a8a 0%, #020617 100%)", color: "#3b82f6", desc: "アナタの魂は、強固なインフラと規律を重んじる『クワドゥン星』に属していマス。カオスなタイムラインの中に美しくnoiselessな構造（ Forms や相談室）を設計し、人々を正しい航路へと導く頼れる指揮官デス。アナタの存在自体が、荒れ狂う地球の荒波のセーフティネットになっていマス。" },
  "D": { icon: "🛸", tag: "Planet: Milzem", name: "ミルゼム星", sub: "【無垢の漂流星】", grad: "linear-gradient(135deg, #065f46 0%, #020617 100%)", color: "#10b981", desc: "アナタの魂は、何者にも縛られず自由の海を泳ぐ『ミルゼム星』に属していマス。クラゲのように宇宙の潮流に身を任せ、自分だけの『 noiseless な余白』を何よりも愛する自由人デス。誰かと競うことなく、静かで心地よい独自の周波数を保ったまま、穏やかな余白を周囲に分け与えマス。" }
};

// 種族データデス (簡易マトリクス用: 多数決で決定デス)
const races = {
  "A": { icon: "🧠", tag: "Race: Scholar", name: "学者種族", sub: "データスキャナー", adv: "知識の深さは最強の武器ですが、地球人には時々難しすぎる暗号に見えることも。たまにはポップな絵文字という擬態を使ってソフトに交信してみまショウ。" },
  "B": { icon: "🎤", tag: "Race: Bard", name: "吟遊詩人種族", sub: "ゴキゲン・スピーカー", adv: "アナタの放つ楽しいビート（言葉）は最高のリハビリデス！ただし、電力を使いすぎて自家発電（ソロ parenting ）で力尽きないよう、時にはコックピットを完全消灯して休んで下サイ。" },
  "C": { icon: "🛠️", tag: "Race: Architect", name: "建築家種族", sub: "ノイズレス・デザイナー", adv: "完璧な設計図をビルドできるアナタデスが、地球人は不完全な『余白』にこそ愛着を抱く生き物デス。あえて未完成のハッチを1つ残しておくと、より強力なアブダクションが成功シマス。" },
  "D": { icon: "🐾", tag: "Race: Observer", name: "定点観測種族", sub: "クワイエット・ベア", adv: "静けさと noiseless な authoritative は完璧デス。アナタの静かなログ（沈黙）自体がメッセージになっていマス。そのまま、あなただけの心地よい航路の座標を維持して下サイ。" }
};

let currentIdx = 0;
let answers = [];

function loadQuestion() {
  const q = questions[currentIdx];
  document.getElementById('qnum').textContent = `Q${currentIdx + 1}`;
  document.getElementById('qtext').textContent = q.text;
  
  const optsDiv = document.getElementById('opts');
  optsDiv.innerHTML = '';
  
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt.val);
    optsDiv.appendChild(btn);
  });
  
  const fillPercent = (currentIdx / questions.length) * 100;
  document.getElementById('pfill').style.width = `${fillPercent}%`;
}

function selectOption(val) {
  answers.push(val);
  currentIdx++;
  
  if (currentIdx < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('qcard').style.display = 'none';
  
  const counts = {};
  let maxVal = answers[0];
  let maxCount = 0;
  
  answers.forEach(val => {
    counts[val] = (counts[val] || 0) + 1;
    if (counts[val] > maxCount) {
      maxCount = counts[val];
      maxVal = val;
    }
  });
  
  const pt = planets[maxVal] || planets["A"];
  const rt = races[maxVal] || races["A"];
  
  // 表示アップデートデス
  const rc = document.getElementById('rcard');
  rc.style.display = 'block';
  rc.style.setProperty('--grad', pt.grad);
  rc.style.boxShadow = `0 20px 50px ${pt.color}20, 0 0 30px ${pt.color}10`;
  
  document.getElementById('ricon').textContent = pt.icon;
  document.getElementById('rtag').innerHTML = `<span style="color:${pt.color}">${pt.tag} / ${rt.tag}</span>`;
  document.getElementById('rname').innerHTML = `<span style="color:${pt.color}">${pt.name}</span>`;
  document.getElementById('rsub').textContent = `${pt.sub} × ${rt.name}`;
  document.getElementById('rdesc').textContent = `${pt.desc}\n\n【アナタの精神種族：${rt.name} (${rt.sub})】\n${rt.adv}`;
  
  document.getElementById('radv').style.borderLeftColor = pt.color;
  document.getElementById('radv-lbl').style.color = pt.color;
  document.getElementById('radv-lbl').textContent = '👽️ 母艦ASTRO号からの戦術データ・交信ログ';
  document.getElementById('radv-txt').textContent = `地球侵略阻止プロトコル適合度 94.3%。${rt.adv}`;
  
  const shareText = `🌌 星の性格診断の結果が出マシタ！\n\n私は「${pt.icon} ${pt.name}」で、精神種族は「${rt.icon} ${rt.name}」デシタ🛸\n\nアナタの性格も、宇宙人に観測されてみル？👇\n`;
  const shareUrl = 'https://stationaryobserverno043.github.io/hoshi-shindan/hoshi_seikaku_shindan.html';
  const xUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}&hashtags=星の性格診断,地球侵略阻止ミッション`;
  document.getElementById('x-link').href = xUrl;

  // 🌟 結果画面に「 ogp_seikaku.png 」をフワッと降臨させるシステムデス！
  const alienLanding = document.createElement('div');
  alienLanding.style.cssText = 'text-align: center; margin-top: 35px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.08); animation: fadeInUp 1s ease-out forwards;';
  alienLanding.innerHTML = `
    <p style="color: #8da2fb; font-size: 0.85rem; margin-bottom: 12px; letter-spacing: 0.05em;">🛸 観測を終えた宇宙人（ヒマジン）たちがアナタを歓迎していマス 🛸</p>
    <img src="ogp_seikaku.png" alt="観測宇宙人たち" style="width: 100%; max-width: 480px; border-radius: 12px; box-shadow: 0 10px 30px rgba(141,162,251,0.15); border: 1px solid rgba(255,255,255,0.1);">
  `;
  document.getElementById('rcard').appendChild(alienLanding);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadQuestion();
</script>
